# Install as /etc/nginx/sites-available/madar and set server_name to the
# production hostname (or server IP for a private LAN-only deployment).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Large ZIP uploads and bulk maintenance-photo transfers.
    client_max_body_size 250M;
    client_body_timeout 600s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Avoid buffering large uploads/exports and allow Socket.IO upgrades.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # Generous timeouts for exports, uploads, and ZIP processing.
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}
